[project]
name = "axiom-intelligence"
version = "0.1.0"
description = "Axiom Intelligence — autonomous agentic factory"
requires-python = ">=3.12"
dependencies = [
    "python-fasthtml>=0.12.0",
    "fastapi[standard]>=0.115.0",
    "starlette>=0.40.0",
    "uvicorn[standard]>=0.30.0",
    "gunicorn>=22.0.0",
    "ruff>=0.16.6",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5.0",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/axiom", "src/backend_service", "src/data_service", "src/website"]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["axiom"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.fastapi]
entrypoint = "axiom.app:axiom_app"
