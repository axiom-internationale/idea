upstream axiom_prod {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen       80;
    server_name  _;
    return 301   https://$host$request_uri;
}

server {
    listen       443 ssl http2;
    server_name  axiomintelligence.xyz www.axiomintelligence.xyz;

    ssl_certificate     /etc/ssl/certs/axiom.crt;
    ssl_certificate_key /etc/ssl/private/axiom.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 10m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
    gzip_min_length 256;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /static/ {
        alias /opt/axiom/src/website/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /media/ {
        alias /opt/axiom/src/website/media/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        proxy_pass         http://axiom_prod;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header   Connection "";

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    location /api/health {
        proxy_pass http://axiom_prod;
        access_log off;
    }

    location /api/liveness {
        proxy_pass http://axiom_prod;
        access_log off;
    }

    location /api/readiness {
        proxy_pass http://axiom_prod;
        access_log off;
    }
}
